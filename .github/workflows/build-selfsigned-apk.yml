name: build-selfsigned-apk

# 自签名中继证书版本：给 APK 内置 DSH Relay CA，使其信任自建 HTTPS 中继。
# 手动触发，或 push 到 main 时自动构建。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/lib/remote/relay_trust.dart'
      - 'app/lib/main.dart'
      - 'app/assets/tls/**'
      - 'app/pubspec.yaml'
      - '.github/workflows/build-selfsigned-apk.yml'

permissions:
  contents: read

concurrency:
  group: selfsigned-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 构建 arm64 运行时（Ubuntu Base + Node + DSH）
        run: ./runtime/build-runtime.sh arm64-v8a

      - name: 构建 APK（arm64, release, debug 签名）
        run: ./tooling/build-apk.sh -f arm64 --build-name 1.0.8-selfsigned

      - name: 列出产物
        run: ls -lh app/build/app/outputs/flutter-apk/

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-selfsigned-arm64
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error
